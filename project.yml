name: GPhotosTV
options:
  bundleIdPrefix: com.gphotostv
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GPhotosTV:
    type: application
    platform: tvOS
    sources:
      - path: GPhotosTV
        excludes:
          - "**/.DS_Store"
    info:
      path: GPhotosTV/App/Info.plist
      properties:
        CFBundleDisplayName: GPhotos TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GPTVClientID: $(GPTV_CLIENT_ID)
        GPTVClientSecret: $(GPTV_CLIENT_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gphotostv.app
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TVOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "3"
